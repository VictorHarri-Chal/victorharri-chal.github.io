minor:
  - name: Area
    year: "2023"
    url: https://github.com/VictorHarri-Chal/AREA
    description: >-
      A comprehensive automation platform similar to IFTTT and Zapier, divided into 3 main
      parts: an Android mobile application, a web application, and a server. Built with
      Node.js Express and MongoDB for the backend, React for the web frontend, and React
      Native for mobile development.

  - name: R-Type
    year: "2023"
    url: https://github.com/VictorHarri-Chal/R-Type
    description: >-
      A recreation of the famous R-Type arcade game built with SFML and C++. Features include
      multiplayer cooperative mode for 2-4 players, two difficulty levels (Easy and Hard), and
      a wave editor for customizing monster spawning. Built with an Entity-Component-System
      architecture for scalable game object management.

  - name: Arcade
    year: "2022"
    url: https://github.com/VictorHarri-Chal/Arcade
    description: >-
      A C++ project recreating an arcade machine with multiple games (Pacman & Nibbler) and
      multiple graphical libraries (Ncurses, SFML, SDL2). The challenge was building a program
      that allows players to swap between games and graphical libraries at runtime, changing
      how the games look.

  - name: Teams
    year: "2022"
    url: https://github.com/VictorHarri-Chal/Teams
    description: >-
      A C-based network project reproducing Microsoft Teams functionality. Features include
      user communication, team/channel/thread creation, subscription to team events, and
      multi-client handling. Built to learn socket programming and communication protocol
      implementation.

  - name: The Plazza
    year: "2022"
    url: https://github.com/VictorHarri-Chal/The-Plazza
    description: >-
      A C++ pizzeria simulation using multi-processing, multi-threading, and IPC
      (inter-process communication). Simulates how a pizzeria works with simultaneous order
      handling, multiple kitchens created gradually, and cooks with varying availability.

  - name: Boomberman
    year: "2022"
    url: https://github.com/VictorHarri-Chal/Boomberman
    description: >-
      A graphical project built with Raylib, a 3D library, to recreate the famous Bomberman
      game. This was the final project of my 2nd year at Epitech, featuring strategic bomb
      placement mechanics and dynamic level design.

  - name: Pokemon RPG
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Pokemon-RPG
    description: >-
      A C-based role-playing game built with CSFML library to recreate a Pokemon game.
      Features include a large map, dialogues, combat system, and a final boss. This project
      taught graphical programming, CSFML usage, and team collaboration with 3 teammates.

  - name: Need4Stek
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Need4Stek
    description: >-
      An artificial intelligence project coded in C that guides an autonomous car through a
      virtual racetrack. Features a simulation between CoppeliaSim software and a C program,
      demonstrating autonomous vehicle navigation and AI decision-making.

  - name: ASM-C-lib
    year: "2021"
    url: https://github.com/VictorHarri-Chal/ASM-C-lib
    description: >-
      An assembly project designed to discover and understand assembly language. The goal was
      to recode common functions from the C library in assembly and compile them into a
      dynamic shared library that can be used by anyone.

  - name: Sokoban
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Sokoban
    description: >-
      A reproduction of the Japanese Sokoban puzzle game built with the ncurses library in C.
      Players move boxes to storage locations while avoiding walls and dead ends. The puzzle
      is solved when all boxes reach their destinations, featuring strategic movement and
      spatial reasoning.

  - name: Matchsticks
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Matchsticks
    description: >-
      A C-based implementation of the famous matchsticks game where players take turns
      removing matchsticks from lines. The player who takes the last matchstick loses.
      Features an AI opponent that plays randomly, demonstrating basic game logic and
      turn-based mechanics.

  - name: Popeye
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Popeye
    description: >-
      A containerized web poll application similar to Strawpoll, built to learn Docker.
      Features a microservices architecture with Flask (Python), Redis queue, Java worker,
      PostgreSQL database, and Node.js result display. Demonstrates containerization and
      microservices deployment.
