# Single source of truth for the projects section.
#
# `featured` projects get a card on /projects and their own detail page at
# /projects/<slug>. `minor` projects only appear as a card in the grid below.
# The CI build reads the slugs from here to know which pages to generate.
#
# accent  : card colour, mapped to Tailwind classes in ProjectsHelper::ACCENTS
# size    : `large` gets the full-height card, `small` the stacked ones
# teaser  : short copy shown on the card
# summary : longer copy shown at the top of the detail page
# link    : url + label + icon (full Font Awesome classes, e.g. "fa-solid fa-link"
#           for a live site rather than a source repository)

featured:
  - slug: nutri-flow
    name: NutriFlow
    period: July 2025 - present
    datetime: "2025-07-01"
    accent: purple
    size: large
    teaser: >-
      A nutrition and training tracker for people who log both. You build a food library you
      actually use, scan a barcode instead of typing the label, and log meals against a daily
      calendar that keeps a running total of your macros. Training gets the same treatment:
      1,100 illustrated exercises, reusable programmes, and cardio scored with ACSM equations.
      Live at nutriflow.in, free and without ads.
    summary: >-
      I was logging meals in one app and workouts in another, and neither knew the other
      existed. NutriFlow is what came out of fixing that for myself. You build a food library
      you actually use, with Nutri-Score, additives and allergens, and scan a barcode instead
      of typing the label. Meals go on a day-by-day calendar that keeps a running total of
      your calories and around twenty nutrients. Recipes are costed to the gram and turn
      straight into a shopping list. Training gets the same treatment: 1,100 illustrated
      exercises, sets and reps for strength work, ACSM equations for cardio, and programmes
      you can reuse week to week. Weight, measurements, hydration, fasting and mood are
      tracked alongside. It runs on Rails 8 in production, I deploy it myself with Kamal, and
      it stays free and ad-free.
    link:
      url: https://nutriflow.in/
      label: Visit the site
      icon: fa-solid fa-arrow-up-right-from-square
    technologies:
      - { name: Ruby on Rails 8, color: red }
      - { name: PostgreSQL, color: green }
      - { name: Hotwire (Turbo + Stimulus), color: cyan }
      - { name: ViewComponent, color: purple }
      - { name: Tailwind CSS, color: indigo }
      - { name: Kamal, color: orange }
      - { name: Docker, color: blue-dark }
    features:
      - Day-by-day meal calendar with running totals for calories and around twenty nutrients
      - Personal food library with Nutri-Score, additives and allergens, plus barcode scanning
      - Recipes costed to the gram that turn straight into a shopping list
      - Calorie targets worked out from your own goals rather than a generic formula
      - Over 1,100 illustrated exercises, with sets, reps and weight for strength work
      - Cardio sessions scored with ACSM equations
      - Reusable training programmes you can carry from week to week
      - Progress tracking for weight, measurements, hydration, fasting and mood

  - slug: vigie
    name: Vigie
    period: March 2026
    datetime: "2026-03-01"
    accent: amber
    size: small
    teaser: >-
      Waste collection teams need to know which containers are full before they send a truck
      out. Vigie maps every collection point, colours it by fill level, and builds an
      optimised round from the ones that actually need emptying.
    summary: >-
      Waste collection teams need to know which containers are full before they send a truck
      out, and most of them are working from spreadsheets. Vigie puts every collection point
      on a map, coloured by fill level, and builds a round from the ones that actually need
      emptying. The routing follows real roads through OSRM rather than drawing straight
      lines between points. Each container opens a panel with its sensor history, its
      deposits, its open incidents and a thirty-day fill graph. Incidents can be filtered,
      resolved, reopened, annotated and exported. Five dashboards cover fill evolution,
      breakdown by waste type, monthly incidents and the points that cause the most trouble.
    link:
      url: https://github.com/VictorHarri-Chal/Vigie
      label: View source code
      icon: fa-brands fa-github
    technologies:
      - { name: Ruby on Rails 8, color: red }
      - { name: PostgreSQL / jsonb, color: blue }
      - { name: Tailwind CSS, color: indigo }
      - { name: Hotwire (Turbo + Stimulus), color: cyan }
      - { name: Leaflet.js + OpenStreetMap, color: green }
      - { name: Chart.js, color: orange }
      - { name: Devise / Simple Form / Pagy, color: purple }
      - { name: OSRM routing, color: yellow }
      - { name: Render, color: emerald }
    features:
      - Map with colour-coded fill levels, waste type filters, search by name or ID, and a container panel loaded in a Turbo Frame
      - Container panel with four tabs for timeline, sensors, deposits and incidents, plus a thirty-day fill graph
      - Incident handling with status filters, resolve and reopen actions, note editing over Turbo Streams, and CSV export
      - Five dashboards covering fill evolution, breakdown by waste type, monthly incidents, and the busiest and most problematic points
      - Round planning with a fill threshold slider, OSRM routing on real roads, an animated route line and an ordered stop list with total distance

  - slug: nestio-bnb
    name: NestioBnb
    period: April 2025
    datetime: "2025-04-01"
    accent: cyan
    size: small
    teaser: >-
      A rental platform built around the map. Listings filter as you pan, booking happens on
      the listing page, and a chatbot suggests places from what you tell it you want.
    summary: >-
      An Airbnb-style rental site where the map does most of the work. Listings filter in real
      time as you move around, and you book straight from the listing page. Hosts manage their
      properties and the requests coming in, guests keep a shortlist of favourites, and a
      chatbot built on the OpenAI API suggests places to stay and things to do from a plain
      description of what you are after. Images are stored on AWS S3.
    link:
      url: https://github.com/VictorHarri-Chal/NestioBnb
      label: View source code
      icon: fa-brands fa-github
    technologies:
      - { name: Ruby on Rails, color: red }
      - { name: Hotwire, color: blue }
      - { name: PostgreSQL, color: green }
      - { name: AWS S3, color: yellow }
      - { name: Mapbox, color: purple }
      - { name: OpenAI API, color: cyan }
      - { name: JavaScript, color: orange }
      - { name: Tailwind CSS, color: indigo }
    features:
      - Mapbox map with filters that apply as you move around
      - Booking handled from the listing page, with availability checks
      - Favourites and incoming request management
      - Chatbot suggesting stays and things to do from a plain description
      - Image storage on AWS S3
      - Search and filtering across the catalogue
      - Separate profiles and dashboards for guests and hosts

  - slug: scandela
    name: Scandela
    period: Sept 2023 - June 2025
    datetime: "2025-06-01"
    accent: emerald
    size: small
    teaser: >-
      My final year project. Local authorities can see every streetlight in Nantes on a map,
      filter the network by what it costs to run, and test a change before committing to it.
      I led the frontend and the product side.
    summary: >-
      Public lighting is expensive and most councils have very little visibility on what
      theirs actually costs them. Scandela maps every streetlight in Nantes with its technical
      detail, lets you filter the network on whichever criteria matter for the decision at
      hand, and simulates the effect of a change before anyone commits to it. The point is to
      cut electricity and carbon without creating dark corners. It shipped as a set rather
      than a single app: a public site, the application itself, and a client server, with
      Raspberry Pi hardware on the field side. I led the frontend and the product management
      on the team.
    link:
      url: https://github.com/Team-Scandela/Scandela
      label: View source code
      icon: fa-brands fa-github
    technologies:
      - { name: React, color: blue }
      - { name: Java Spring Boot, color: green }
      - { name: Typescript, color: yellow }
      - { name: Docker, color: blue-dark }
      - { name: Raspberry Pi, color: red }
      - { name: PostgreSQL, color: purple }
      - { name: Mapbox, color: indigo }
    features:
      - Map of the full streetlight network with the technical detail behind each point
      - Filters built for optimisation decisions rather than generic browsing
      - Simulation of a change and its effect on cost and coverage before it is committed
      - Cost analysis covering both electricity spend and carbon
      - Safety and lighting quality assessment across an area
      - Delivered as a public site, an application and a client server
      - Raspberry Pi integration for the hardware side

minor:
  - name: Area
    year: "2023"
    url: https://github.com/VictorHarri-Chal/AREA
    description: >-
      A comprehensive automation platform similar to IFTTT and Zapier, divided into 3 main
      parts: an Android mobile application, a web application, and a server. Built with
      Node.js Express and MongoDB for the backend, React for the web frontend, and React
      Native for mobile development.

  - name: R-Type
    year: "2023"
    url: https://github.com/VictorHarri-Chal/R-Type
    description: >-
      A recreation of the famous R-Type arcade game built with SFML and C++. Features include
      multiplayer cooperative mode for 2-4 players, two difficulty levels (Easy and Hard), and
      a wave editor for customizing monster spawning. Built with an Entity-Component-System
      architecture for scalable game object management.

  - name: Arcade
    year: "2022"
    url: https://github.com/VictorHarri-Chal/Arcade
    description: >-
      A C++ project recreating an arcade machine with multiple games (Pacman & Nibbler) and
      multiple graphical libraries (Ncurses, SFML, SDL2). The challenge was building a program
      that allows players to swap between games and graphical libraries at runtime, changing
      how the games look.

  - name: Teams
    year: "2022"
    url: https://github.com/VictorHarri-Chal/Teams
    description: >-
      A C-based network project reproducing Microsoft Teams functionality. Features include
      user communication, team/channel/thread creation, subscription to team events, and
      multi-client handling. Built to learn socket programming and communication protocol
      implementation.

  - name: The Plazza
    year: "2022"
    url: https://github.com/VictorHarri-Chal/The-Plazza
    description: >-
      A C++ pizzeria simulation using multi-processing, multi-threading, and IPC
      (inter-process communication). Simulates how a pizzeria works with simultaneous order
      handling, multiple kitchens created gradually, and cooks with varying availability.

  - name: Boomberman
    year: "2022"
    url: https://github.com/VictorHarri-Chal/Boomberman
    description: >-
      A graphical project built with Raylib, a 3D library, to recreate the famous Bomberman
      game. This was the final project of my 2nd year at Epitech, featuring strategic bomb
      placement mechanics and dynamic level design.

  - name: Pokemon RPG
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Pokemon-RPG
    description: >-
      A C-based role-playing game built with CSFML library to recreate a Pokemon game.
      Features include a large map, dialogues, combat system, and a final boss. This project
      taught graphical programming, CSFML usage, and team collaboration with 3 teammates.

  - name: Need4Stek
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Need4Stek
    description: >-
      An artificial intelligence project coded in C that guides an autonomous car through a
      virtual racetrack. Features a simulation between CoppeliaSim software and a C program,
      demonstrating autonomous vehicle navigation and AI decision-making.

  - name: ASM-C-lib
    year: "2021"
    url: https://github.com/VictorHarri-Chal/ASM-C-lib
    description: >-
      An assembly project designed to discover and understand assembly language. The goal was
      to recode common functions from the C library in assembly and compile them into a
      dynamic shared library that can be used by anyone.

  - name: Sokoban
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Sokoban
    description: >-
      A reproduction of the Japanese Sokoban puzzle game built with the ncurses library in C.
      Players move boxes to storage locations while avoiding walls and dead ends. The puzzle
      is solved when all boxes reach their destinations, featuring strategic movement and
      spatial reasoning.

  - name: Matchsticks
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Matchsticks
    description: >-
      A C-based implementation of the famous matchsticks game where players take turns
      removing matchsticks from lines. The player who takes the last matchstick loses.
      Features an AI opponent that plays randomly, demonstrating basic game logic and
      turn-based mechanics.

  - name: Popeye
    year: "2021"
    url: https://github.com/VictorHarri-Chal/Popeye
    description: >-
      A containerized web poll application similar to Strawpoll, built to learn Docker.
      Features a microservices architecture with Flask (Python), Redis queue, Java worker,
      PostgreSQL database, and Node.js result display. Demonstrates containerization and
      microservices deployment.
