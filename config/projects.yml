# Single source of truth for the projects section.
#
# `featured` projects get a card on /projects and their own detail page at
# /projects/<slug>. `minor` projects only appear as a card in the grid below.
# The CI build reads the slugs from here to know which pages to generate.
#
# accent  : card colour, mapped to Tailwind classes in ProjectsHelper::ACCENTS
# size    : `large` gets the full-height card, `small` the stacked ones
# teaser  : short copy shown on the card
# summary : longer copy shown at the top of the detail page
# link    : url + label + icon (full Font Awesome classes, e.g. "fa-solid fa-link"
#           for a live site rather than a source repository)

featured:
  - slug: vigie
    name: Vigie
    period: March 2026
    datetime: "2026-03-01"
    accent: amber
    size: large
    teaser: >-
      Vigie gives municipal teams a real-time view of their entire waste collection network.
      Spot which collection points need emptying on a color-coded map, plan optimized tours
      with road-accurate routing, manage incidents, and track fleet performance through
      dedicated dashboards — all in one place.
    summary: >-
      Vigie gives municipal teams a real-time view of their entire waste collection network.
      Spot which collection points need emptying on a color-coded map, plan optimized tours
      with road-accurate routing, manage incidents, and track fleet performance through
      dedicated dashboards — all in one place.
    link:
      url: https://github.com/VictorHarri-Chal/Vigie
      label: View source code
      icon: fa-brands fa-github
    technologies:
      - { name: Ruby on Rails 8, color: red }
      - { name: PostgreSQL / jsonb, color: blue }
      - { name: Tailwind CSS, color: indigo }
      - { name: Hotwire (Turbo + Stimulus), color: cyan }
      - { name: Leaflet.js + OpenStreetMap, color: green }
      - { name: Chart.js, color: orange }
      - { name: Devise / Simple Form / Pagy, color: purple }
      - { name: OSRM routing, color: yellow }
      - { name: Render, color: emerald }
    features:
      - Interactive map with color-coded fill levels, waste type filters, search by name or ID, and a PAV detail panel in Turbo Frame
      - PAV panel with 4 tabs (timeline, sensors, deposits, incidents) and a 30-day Chart.js fill evolution graph
      - Incident management with status filters, resolve/reopen actions, Turbo Stream note editing, and CSV export
      - "5 Chart.js dashboards: fill evolution, breakdown by waste type, monthly incidents, top active and most problematic PAVs"
      - Tour planning with threshold slider, OSRM routing on real roads, animated polyline, and ordered PAV list with total distance

  - slug: nutri-flow
    name: NutriFlow
    period: July 2025
    datetime: "2025-07-01"
    accent: purple
    size: small
    teaser: >-
      Fitness and nutrition tracking for athletes. Customizable food database, daily meal
      planning with macro tracking, recipe management, shopping lists, and workout
      performance tracking.
    summary: >-
      Comprehensive fitness and nutrition tracking application designed for athletes and
      health-conscious individuals. Features include customizable food database, daily meal
      planning with macro tracking, personalized calorie calculations, recipe management,
      interactive shopping lists, and workout performance tracking.
    link:
      url: https://github.com/VictorHarri-Chal/NutriFlow
      label: View source code
      icon: fa-brands fa-github
    technologies:
      - { name: Ruby on Rails, color: red }
      - { name: Hotwire, color: blue }
      - { name: PostgreSQL, color: green }
      - { name: JavaScript, color: orange }
      - { name: Tailwind CSS, color: indigo }
    features:
      - Customizable food database where users can add their most consumed foods with macros and calories
      - Daily calendar for meal tracking throughout the day with meal management and total calorie, protein, lipid tracking
      - Daily calorie needs calculation based on individual goals influencing daily requirements
      - Recipe management system with all necessary ingredients, macros, and nutritional information
      - Interactive shopping list directly linked to food database and recipes for easy ingredient addition
      - Workout tracking for strength training to monitor performance and easily modify programs
      - Responsive interface with real-time updates using Hotwire
      - Personalized nutrition and fitness recommendations

