name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Precompile assets
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'dummy_secret_key_base_for_build_' }}
        run: |
          RAILS_ENV=production bundle exec rails assets:precompile

      - name: Build static site
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'dummy_secret_key_base_for_build_' }}
          PORT: 3000
        run: |
          bundle exec rails server -e production -p 3000 -b 0.0.0.0 > /tmp/rails.log 2>&1 &
          RAILS_PID=$!

          echo "Waiting for Rails server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/up > /dev/null 2>&1; then
              echo "Rails server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start. Logs:"
              cat /tmp/rails.log
              exit 1
            fi
            sleep 2
          done

          mkdir -p _site

          echo "Downloading pages..."
          curl -sL http://localhost:3000/ -o _site/index.html
          curl -sL http://localhost:3000/about -o _site/about.html
          curl -sL http://localhost:3000/contact -o _site/contact.html
          curl -sL http://localhost:3000/projects -o _site/projects.html
          
          mkdir -p _site/projects
          curl -sL http://localhost:3000/projects/vigie -o _site/projects/vigie.html
          curl -sL http://localhost:3000/projects/nutri-flow -o _site/projects/nutri-flow.html
          curl -sL http://localhost:3000/projects/nestio-bnb -o _site/projects/nestio-bnb.html
          curl -sL http://localhost:3000/projects/scandela -o _site/projects/scandela.html

          for file in _site/*.html; do
            if [ ! -s "$file" ] || grep -q "Action Controller: Exception" "$file"; then
              echo "Error: $file is empty or contains an error page"
              head -50 "$file" || true
              exit 1
            fi
            echo "✓ $(basename $file) downloaded ($(wc -c < "$file") bytes)"
          done

          kill $RAILS_PID 2>/dev/null || true
          sleep 2
          pkill -f 'rails server' || true

          echo "Copying assets..."
          cp -r public/assets _site/assets 2>/dev/null || true
          cp -r public/*.svg _site/ 2>/dev/null || true
          cp -r public/*.pdf _site/ 2>/dev/null || true
          cp -r public/*.txt _site/ 2>/dev/null || true

          echo "Fixing links in HTML files..."
          find _site -name "*.html" -type f -exec sed -i 's|http://localhost:3000/||g' {} \;
          
          # Fix links in root HTML files (./assets/)
          find _site -maxdepth 1 -name "*.html" -type f -exec sed -i 's|href="/|href="./|g' {} \;
          find _site -maxdepth 1 -name "*.html" -type f -exec sed -i 's|src="/|src="./|g' {} \;
          find _site -maxdepth 1 -name "*.html" -type f -exec sed -i 's|action="/|action="./|g' {} \;
          find _site -maxdepth 1 -name "*.html" -type f -exec sed -i 's|"\/assets/|"./assets/|g' {} \;
          
          # Fix links in project HTML files (../assets/ since they're in a subdirectory)
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="/|href="../|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|src="/|src="../|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|action="/|action="../|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|"\/assets/|"../assets/|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="\.\/assets/|href="../assets/|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|src="\.\/assets/|src="../assets/|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="/icon\.|href="../icon.|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|src="/icon\.|src="../icon.|g' {} \;
          
          # Fix navigation links in project pages to point to root pages
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="\.\.\/about"|href="../about.html"|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="\.\.\/contact"|href="../contact.html"|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="\.\.\/projects"|href="../projects.html"|g' {} \;
          find _site/projects -name "*.html" -type f -exec sed -i 's|href="\.\.\/"|href="../index.html"|g' {} \;
          
          # Fix project links to point to .html files for GitHub Pages
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\/projects\/vigie"|href="./projects/vigie.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\/projects\/nutri-flow"|href="./projects/nutri-flow.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\/projects\/nestio-bnb"|href="./projects/nestio-bnb.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\/projects\/scandela"|href="./projects/scandela.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\.\/projects\/vigie"|href="../projects/vigie.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\.\/projects\/nutri-flow"|href="../projects/nutri-flow.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\.\/projects\/nestio-bnb"|href="../projects/nestio-bnb.html"|g' {} \;
          find _site -name "*.html" -type f -exec sed -i 's|href="\.\.\/projects\/scandela"|href="../projects/scandela.html"|g' {} \;
          
          # Fix JavaScript navigation links
          find _site -name "*.html" -type f -exec sed -i 's|window\.location\.href = "/projects/|window.location.href = "./projects/|g' {} \;
          find _site -name "*.js" -type f -exec sed -i 's|window\.location\.href = "/projects/|window.location.href = "./projects/|g' {} \;

          touch _site/.nojekyll
          echo "Static site built successfully!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

