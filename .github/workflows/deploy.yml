name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the deploy job needs write access; the build job runs third-party code.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  RAILS_ENV: production
  SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'dummy_secret_key_base_for_static_build' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages settings; it never writes.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Build static site
        run: |
          bundle exec rails server -e production -p 3000 -b 127.0.0.1 > /tmp/rails.log 2>&1 &
          bundle exec ruby script/build_static.rb || {
            echo "::group::Rails server log"
            cat /tmp/rails.log
            echo "::endgroup::"
            exit 1
          }

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "_site"

  # Skipped on branches, so a manual run can validate the build without publishing.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
